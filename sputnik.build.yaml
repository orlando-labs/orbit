requires:
  sputnik: ">=1.0.0 <2.0.0"
schema: "sputnik.build.v1"
name: "orbit"
version: "1.0.0-rc.1"
source_root: "src"
profiles:
  required:
    - "core.v1"
    - "macro.v1"
  optional: []
  forbidden: []
files:
  - "src/orbit.s"
  - "src/orbit/html.s"
  - "src/orbit/assets.s"
  - "src/orbit/middleware.s"
  - "src/orbit/multipart.s"
  - "src/orbit/security.s"
  - "src/orbit/telemetry.s"
  - "src/orbit/testing.s"
  - "README.md"
  - "LICENSE"
capabilities:
  net.listen: true
  random.secure: true
  fs.read: true
  fs.metadata: true
