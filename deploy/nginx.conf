# Orbit 1.0 trusted-edge example. Replace addresses and certificate paths.
upstream orbit_app {
    server 127.0.0.1:3000 max_fails=2 fail_timeout=5s;
    keepalive 64;
}

server {
    listen 443 ssl http2;
    server_name app.example.test;

    ssl_certificate /etc/ssl/app.example.test/fullchain.pem;
    ssl_certificate_key /etc/ssl/app.example.test/private.key;

    # Operational endpoints should instead be restricted to the platform
    # network/auth policy. This example denies public access.
    location ~ ^/(live|ready|metrics)$ {
        deny all;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        # Overwrite, never append, client-supplied forwarding metadata.
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;

        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 35s;
        proxy_read_timeout 35s;
        proxy_pass http://orbit_app;
    }
}
