apiVersion: apps/v1
kind: Deployment
metadata:
  name: ember-app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: ember-app
  template:
    metadata:
      labels:
        app: ember-app
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: app
          image: registry.example.test/ember-app@sha256:REPLACE_WITH_RELEASE_DIGEST
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: ember-app
spec:
  selector:
    app: ember-app
  ports:
    - name: http
      port: 3000
      targetPort: http
