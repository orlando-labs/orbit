schema: sputnik.build.v1
name: orbit.example.sqlite_users
root: orbit.example.sqlite_users

profiles:
  required: [core.v1, ffi.v1, macro.v1]
  optional: []
  forbidden: []

modules:
  - name: sqlite3
    path: ../.build/dependencies/sqlite3/src/sqlite3.s
  - name: orm
    path: ../.build/dependencies/orm/src/orm.s
  - name: orm.pool
    path: ../.build/dependencies/orm/src/orm/pool.s
  - name: orm.sqlite3.adapter
    path: ../.build/dependencies/orm/src/orm/sqlite3/adapter.s
  - name: orm.sqlite3.pool
    path: ../.build/dependencies/orm/src/orm/sqlite3/pool.s
  - name: orm.sqlite3
    path: ../.build/dependencies/orm/src/orm/sqlite3.s
  - name: orbit
    path: ../src/orbit.s
  - name: orbit.integrations.orm
    path: ../packages/orbit-orm/src/orbit/integrations/orm.s
  - name: orbit.example.sqlite_users
    path: sqlite_users.s

native_extensions:
  - name: sqlite3
    language: c
    sources:
      - ../.build/dependencies/sqlite3/native/sqlite3_ext.c
      - ../.build/dependencies/sqlite3/native/sqlite3.c
    headers:
      - ../.build/dependencies/sqlite3/native/sqlite3.h
    defines:
      - SQLITE_THREADSAFE=1
      - SQLITE_ENABLE_COLUMN_METADATA=1
      - SQLITE_ENABLE_FTS5=1
      - SQLITE_ENABLE_JSON1=1
      - SQLITE_DQS=0
      - SQLITE_OMIT_LOAD_EXTENSION=1
