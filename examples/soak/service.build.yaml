schema: sputnik.build.v1
name: ember.example.soak.service
root: ember.example.soak.service

profiles:
  required: [core.v1, ffi.v1, macro.v1]
  optional: []
  forbidden: []

modules:
  - name: sqlite3
    path: ../../.build/dependencies/sqlite3-sputnik/src/sqlite3.s
  - name: orm
    path: ../../.build/dependencies/sputnik-orm/src/orm.s
  - name: orm.pool
    path: ../../.build/dependencies/sputnik-orm/src/orm/pool.s
  - name: orm.sqlite3.adapter
    path: ../../.build/dependencies/sputnik-orm/src/orm/sqlite3/adapter.s
  - name: orm.sqlite3.pool
    path: ../../.build/dependencies/sputnik-orm/src/orm/sqlite3/pool.s
  - name: orm.sqlite3
    path: ../../.build/dependencies/sputnik-orm/src/orm/sqlite3.s
  - name: ember
    path: ../../src/ember.s
  - name: ember.telemetry
    path: ../../src/ember/telemetry.s
  - name: ember.integrations.orm
    path: ../../packages/ember-orm/src/ember/integrations/orm.s
  - name: ember.example.soak.service
    path: service.s

native_extensions:
  - name: sqlite3
    language: c
    sources:
      - ../../.build/dependencies/sqlite3-sputnik/native/sqlite3_ext.c
      - ../../.build/dependencies/sqlite3-sputnik/native/sqlite3.c
    headers:
      - ../../.build/dependencies/sqlite3-sputnik/native/sqlite3.h
    blocking_symbols:
      - amsq_pool_acquire_wait
    defines:
      - SQLITE_THREADSAFE=1
      - SQLITE_ENABLE_COLUMN_METADATA=1
      - SQLITE_ENABLE_FTS5=1
      - SQLITE_ENABLE_JSON1=1
      - SQLITE_DQS=0
      - SQLITE_OMIT_LOAD_EXTENSION=1
