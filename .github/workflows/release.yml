name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify immutable annotated SemVer tag
        run: |
          test "${GITHUB_REF_NAME}" = "v$(tr -d '\n' < VERSION)"
          test "$(git cat-file -t "${GITHUB_REF_NAME}")" = tag
          python3 -c 'import re,sys; sys.exit(not bool(re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?", sys.argv[1])))' "${GITHUB_REF_NAME}"
      - name: Run clean-room package/install/example gate
        run: ./script/clean-room-build
      - name: Build signed package twice and source archive
        env:
          EMBER_PACKAGE_SIGNING_KEY: ${{ secrets.EMBER_PACKAGE_SIGNING_KEY }}
          EMBER_PACKAGE_KEY_ID: ${{ vars.EMBER_PACKAGE_KEY_ID }}
        run: |
          test -n "${EMBER_PACKAGE_SIGNING_KEY}"
          test -n "${EMBER_PACKAGE_KEY_ID}"
          mkdir -p dist
          SPUTNIK=.build/dependencies/sputnik-lang/build/sputnik
          VERSION_VALUE=$(tr -d '\n' < VERSION)
          "${SPUTNIK}" package-build sputnik.toml "dist/ember-${VERSION_VALUE}.first.sputnikpkg" --sign-key "${EMBER_PACKAGE_SIGNING_KEY}" --key-id "${EMBER_PACKAGE_KEY_ID}" >/dev/null
          "${SPUTNIK}" package-build sputnik.toml "dist/ember-${VERSION_VALUE}.second.sputnikpkg" --sign-key "${EMBER_PACKAGE_SIGNING_KEY}" --key-id "${EMBER_PACKAGE_KEY_ID}" >/dev/null
          cmp "dist/ember-${VERSION_VALUE}.first.sputnikpkg" "dist/ember-${VERSION_VALUE}.second.sputnikpkg"
          mv "dist/ember-${VERSION_VALUE}.first.sputnikpkg" "dist/ember-${VERSION_VALUE}.sputnikpkg"
          rm "dist/ember-${VERSION_VALUE}.second.sputnikpkg"
          "${SPUTNIK}" package-verify "dist/ember-${VERSION_VALUE}.sputnikpkg" --sign-key "${EMBER_PACKAGE_SIGNING_KEY}" >/dev/null
          "${SPUTNIK}" package-build packages/ember-orm/sputnik.toml "dist/ember-orm-${VERSION_VALUE}.first.sputnikpkg" --sign-key "${EMBER_PACKAGE_SIGNING_KEY}" --key-id "${EMBER_PACKAGE_KEY_ID}" >/dev/null
          "${SPUTNIK}" package-build packages/ember-orm/sputnik.toml "dist/ember-orm-${VERSION_VALUE}.second.sputnikpkg" --sign-key "${EMBER_PACKAGE_SIGNING_KEY}" --key-id "${EMBER_PACKAGE_KEY_ID}" >/dev/null
          cmp "dist/ember-orm-${VERSION_VALUE}.first.sputnikpkg" "dist/ember-orm-${VERSION_VALUE}.second.sputnikpkg"
          mv "dist/ember-orm-${VERSION_VALUE}.first.sputnikpkg" "dist/ember-orm-${VERSION_VALUE}.sputnikpkg"
          rm "dist/ember-orm-${VERSION_VALUE}.second.sputnikpkg"
          "${SPUTNIK}" package-verify "dist/ember-orm-${VERSION_VALUE}.sputnikpkg" --sign-key "${EMBER_PACKAGE_SIGNING_KEY}" >/dev/null
          git archive --format=tar --prefix="ember-${VERSION_VALUE}/" "${GITHUB_REF_NAME}" | gzip -n > "dist/ember-${VERSION_VALUE}.tar.gz"
      - name: Checksums and release evidence
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, platform
          root = pathlib.Path('.')
          dist = root / 'dist'
          files = sorted(path for path in dist.iterdir() if path.is_file())
          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          (dist / 'SHA256SUMS').write_text(''.join(f'{digest(path)}  {path.name}\n' for path in files))
          lock = json.loads((root / 'release/dependencies.lock.json').read_text())
          evidence = {
              'schema': 'ember.release-evidence.v1',
              'version': (root / 'VERSION').read_text().strip(),
              'tag': os.environ['GITHUB_REF_NAME'],
              'commit': os.environ['GITHUB_SHA'],
              'runner': platform.platform(),
              'dependencies': lock['dependencies'],
              'artifacts': {path.name: digest(path) for path in files},
              'clean_room': json.loads((root / '.build/clean-room/evidence.json').read_text()),
          }
          (dist / 'release-evidence.json').write_text(json.dumps(evidence, indent=2, sort_keys=True) + '\n')
          PY
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"
      - uses: actions/upload-artifact@v4
        with:
          name: ember-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --title "Ember ${GITHUB_REF_NAME#v}" --notes-file CHANGELOG.md --prerelease
