schema: sputnik.build.v1
name: app.external_templates
root: app.external_templates
profiles:
  required: [core.v1, macro.v1, ffi.v1]
source_formats:
  - suffix: .html.sv
    module: orbit.html
    macro: html
  - suffix: .sql.sv
    module: sqlite3
    macro: sql
  - suffix: .cmd.sv
    module: system
    macro: cmd
modules:
  - name: orbit
    path: ../src/orbit.s
  - name: orbit.html
    path: ../src/orbit/html.s
  - name: orbit.telemetry
    path: ../src/orbit/telemetry.s
  - name: sqlite3
    path: ../../sqlite3/src/sqlite3.s
  - name: app.external_templates
    path: external_templates_selftest.s
native_extensions:
  - name: sqlite3
    language: c
    sources:
      - ../../sqlite3/native/sqlite3_ext.c
      - ../../sqlite3/native/sqlite3.c
    headers:
      - ../../sqlite3/native/sqlite3.h
    defines:
      - SQLITE_THREADSAFE=1
      - SQLITE_ENABLE_COLUMN_METADATA=1
      - SQLITE_ENABLE_FTS5=1
      - SQLITE_ENABLE_JSON1=1
      - SQLITE_DQS=0
      - SQLITE_OMIT_LOAD_EXTENSION=1
